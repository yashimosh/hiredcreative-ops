# Portal Scanner Configuration
# Used by /hiredcreative-ops scan to discover new offers automatically.
#
# Strategy (3 levels):
#   1. Playwright → careers_url of each company (real-time, reliable)
#   2. Greenhouse API → structured JSON (fast, Greenhouse-only)
#   3. WebSearch with site: filters (broad discovery, may be stale)
#
# Plus a fourth, zero-effort level: the Hired Creative integration below queries
# https://hiredcreative.com/api/jobs — a free aggregator of remote creative jobs
# covering 22+ sources (Greenhouse, Ashby, Lever, Workable, Dribbble, WeWorkRemotely,
# Welcome to the Jungle, and more). That gives you BREADTH out of the box. The
# tracked_companies list below is for DEPTH — your specific dream companies, checked
# directly so you never miss a posting even if an aggregator's crawl lags.
#
# IMPORTANT: Each company in tracked_companies MUST have careers_url.
#   Prefer the BRANDED company careers URL whenever available; use ATS-hosted URL only as fallback.
#   ✅ https://careers.company.com   ⚠️ https://company.wd1.myworkdayjobs.com (fallback only)
#   Exception: ATS-hosted careers_url is acceptable when no branded careers page exists.
#   Using raw ATS URLs when a branded page exists can cause false 410 errors (job ID mismatch).
#
# HOW TO CUSTOMIZE:
#   1. Copy this file to portals.yml in the project root
#   2. Edit title_filter.positive with YOUR target role keywords
#   3. Add/remove companies in tracked_companies
#   4. Adjust search_queries for your preferred job boards
#   5. Set enabled: false on companies you don't care about

# -- Hired Creative integration --
# Queries Hired Creative (hiredcreative.com) — a free, remote-creative-jobs
# aggregator (design, brand, motion, illustration, writing, art direction).
# Applies the same title_filter below. Set enabled: false to skip it.
hiredcreative:
  enabled: true
  url: https://hiredcreative.com/api/jobs

# -- Title filter --
# The scanner uses these keywords to decide if a title is relevant.
# At least 1 positive must match AND 0 negatives must match (case-insensitive).

title_filter:
  positive:
    # [CUSTOMIZE] Add keywords matching YOUR target roles
    # -- Leadership / direction --
    - "Creative Director"
    - "Art Director"
    - "Design Director"
    - "Head of Design"
    - "Head of Brand"
    - "Design Lead"
    - "Brand Lead"
    # -- Design (product, brand, visual) --
    - "Product Designer"
    - "UX Designer"
    - "UI Designer"
    - "UX/UI"
    - "Brand Designer"
    - "Visual Designer"
    - "Graphic Designer"
    - "Digital Designer"
    - "Design Systems"
    # -- Motion / video --
    - "Motion Designer"
    - "Motion Graphics"
    - "Animator"
    - "Video Editor"
    - "Video Producer"
    # -- Content / copy --
    - "Copywriter"
    - "Content Designer"
    - "Content Strategist"
    - "UX Writer"
    - "UX Writing"
    # -- Illustration / 3D --
    - "Illustrator"
    - "3D Artist"
    - "Concept Artist"
    # -- Marketing-adjacent creative --
    - "Marketing Designer"
    - "Social Media Designer"
    - "Brand Marketing"
  negative:
    # [CUSTOMIZE] Add keywords for roles you want to exclude
    - "Junior"
    - "Intern"
    - "Sales Engineer"
    - "Software Engineer"
    - "Backend Engineer"
    - "DevOps"
    - "Data Scientist"
    - "Firmware"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "Salesforce Admin"
    - "SAP "
  seniority_boost:
    # These prefixes add relevance but are not required
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head"
    - "Director"

# -- Search queries --
# Each query triggers a WebSearch. Use site: to filter by portal.
# The scanner extracts title, URL, and company from results.
# [CUSTOMIZE] This is a starter set across major boards — add your own per the same pattern.

search_queries:
  # -- Ashby --
  - name: Ashby — Creative Director / Art Director
    query: 'site:jobs.ashbyhq.com "Creative Director" OR "Art Director" remote'

  - name: Ashby — Product Designer
    query: 'site:jobs.ashbyhq.com "Product Designer" OR "Senior Product Designer" remote'

  - name: Ashby — Brand Designer
    query: 'site:jobs.ashbyhq.com "Brand Designer" OR "Visual Designer" remote'

  # -- Greenhouse --
  - name: Greenhouse — Creative Director / Art Director
    query: 'site:job-boards.greenhouse.io "Creative Director" OR "Art Director" remote'

  - name: Greenhouse — Product/Brand Designer
    query: 'site:job-boards.greenhouse.io "Product Designer" OR "Brand Designer" remote'

  - name: Greenhouse — Motion Designer
    query: 'site:job-boards.greenhouse.io "Motion Designer" OR "Motion Graphics" remote'

  # -- Workable / Lever --
  - name: Workable — Design roles
    query: 'site:apply.workable.com "Creative Director" OR "Art Director" OR "Product Designer" remote'

  - name: Lever — Design roles
    query: 'site:jobs.lever.co "Creative Director" OR "Senior Product Designer" OR "Brand Designer" remote'

  # -- Remote job boards --
  - name: RemoteOK — Design
    query: 'site:remoteok.com "Creative Director" OR "Product Designer" OR "Brand Designer"'

  - name: WeWorkRemotely — Design
    query: 'site:weworkremotely.com "Creative Director" OR "Design Lead" OR "Product Designer"'

  - name: Working Nomads — Design
    query: 'site:workingnomads.com "Creative Director" OR "Product Designer" OR "Brand Designer"'

  - name: Himalayas — Design
    query: 'site:himalayas.app "Creative Director" OR "Product Designer" OR "Brand Designer"'

  # -- Creative-specific boards --
  - name: Dribbble Jobs
    query: 'site:dribbble.com/jobs "Creative Director" OR "Product Designer" remote'

  - name: Authentic Jobs — Design
    query: 'site:authenticjobs.com "Creative Director" OR "Art Director" OR "Product Designer"'

  # -- Startup / YC --
  - name: YC Jobs — Design
    query: 'site:workatastartup.com "Product Designer" OR "Founding Designer" OR "Design Lead"'

  # -- Community boards --
  - name: HN Who's Hiring — Design
    query: 'site:news.ycombinator.com "who is hiring" "Product Designer" OR "Creative Director"'

  - name: Welcome to the Jungle — Design
    query: 'site:welcometothejungle.com "Creative Director" OR "Product Designer" remote'

# -- Tracked companies --
# Companies whose career pages are checked directly, for extra depth on top of the
# Hired Creative feed above. scan_method: playwright (default), websearch, greenhouse_api.
# For Greenhouse companies, add api: field for faster structured JSON access — but
# only if you've verified the token yourself; otherwise use scan_method: websearch,
# which degrades gracefully instead of hitting a wrong/broken endpoint.
# [CUSTOMIZE] This is a starter list of well-known, design-forward companies and
# agencies — replace with YOUR dream companies. Verify each careers_url actually
# resolves before relying on it.

tracked_companies:

